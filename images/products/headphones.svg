<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="#ffffff"/>
  <!-- Headphones -->
  <ellipse cx="70" cy="110" rx="25" ry="35" fill="#dc2626"/>
  <ellipse cx="130" cy="110" rx="25" ry="35" fill="#dc2626"/>
  <!-- Headband -->
  <path d="M 70 75 Q 100 45 130 75" stroke="#b91c1c" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- Inner ear cups -->
  <ellipse cx="70" cy="110" rx="18" ry="26" fill="#ef4444"/>
  <ellipse cx="130" cy="110" rx="18" ry="26" fill="#ef4444"/>
  <!-- Speaker grills -->
  <circle cx="70" cy="110" r="10" fill="#7f1d1d"/>
  <circle cx="130" cy="110" r="10" fill="#7f1d1d"/>
</svg>