<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="#ffffff"/>
  <!-- Power bank body -->
  <rect x="50" y="70" width="100" height="70" rx="10" fill="#dc2626"/>
  <rect x="55" y="75" width="90" height="60" rx="8" fill="#b91c1c"/>
  <!-- USB port -->
  <rect x="140" y="95" width="8" height="20" rx="2" fill="#450a0a"/>
  <!-- LED indicators -->
  <circle cx="75" cy="105" r="4" fill="#fef3c7"/>
  <circle cx="90" cy="105" r="4" fill="#fef3c7"/>
  <circle cx="105" cy="105" r="4" fill="#fef3c7"/>
  <circle cx="120" cy="105" r="4" fill="#e5e7eb"/>
  <!-- Capacity text -->
  <text x="100" y="125" font-family="Arial" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">20000mAh</text>
</svg>