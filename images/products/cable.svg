<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="#ffffff"/>
  <!-- USB-C Cable -->
  <!-- Left connector (USB-A) -->
  <rect x="30" y="90" width="25" height="20" rx="3" fill="#374151"/>
  <rect x="32" y="93" width="21" height="14" rx="2" fill="#1f2937"/>
  <rect x="35" y="96" width="15" height="8" fill="#6b7280"/>
  <!-- Cable body -->
  <path d="M 55 100 Q 80 85 100 100 Q 120 115 145 100" stroke="#1f2937" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Right connector (USB-C) -->
  <rect x="145" y="90" width="25" height="20" rx="3" fill="#374151"/>
  <rect x="147" y="93" width="21" height="14" rx="2" fill="#1f2937"/>
  <rect x="150" y="96" width="15" height="8" rx="4" fill="#6b7280"/>
  <!-- Cable braiding texture -->
  <line x1="60" y1="100" x2="140" y2="100" stroke="#4b5563" stroke-width="1" opacity="0.5"/>
</svg>