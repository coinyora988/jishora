<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- White background -->
  <rect width="200" height="200" fill="#ffffff"/>
  
  <!-- Headphones product -->
  <ellipse cx="70" cy="100" rx="25" ry="30" fill="#f97316"/>
  <ellipse cx="130" cy="100" rx="25" ry="30" fill="#f97316"/>
  
  <!-- Headband -->
  <path d="M 70 70 Q 100 40 130 70" stroke="#ea580c" stroke-width="12" fill="none" stroke-linecap="round"/>
  
  <!-- Inner ear cups -->
  <ellipse cx="70" cy="100" rx="18" ry="22" fill="#fb923c"/>
  <ellipse cx="130" cy="100" rx="18" ry="22" fill="#fb923c"/>
  
  <!-- Details -->
  <circle cx="70" cy="100" r="8" fill="#fed7aa"/>
  <circle cx="130" cy="100" r="8" fill="#fed7aa"/>
</svg>